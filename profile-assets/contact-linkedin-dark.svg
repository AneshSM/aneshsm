<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="t">
  <title id="t">LinkedIn</title>
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pencil2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#303034"/>
  <rect x="3" y="2.5" width="43" height="43" rx="10" fill="none" stroke="#2c7bcb" stroke-width="1.2" opacity=".45" filter="url(#pencil2)"/>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="none" stroke="#2c7bcb" stroke-width="2" filter="url(#pencil)"/>
  <text x="24" y="32" text-anchor="middle" font-family="'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#2c7bcb">in</text>
</svg>
