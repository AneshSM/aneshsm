<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Anesh Somanath Majalikar</title>
  <desc id="d">Software Engineer, full stack (PERN). Version control, deployment and migration for Qlik Sense and Power BI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1416"/>
      <stop offset="1" stop-color="#0a2622"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(45,212,191,0.10)"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace; }
      .pulse { transform-origin: 1050px 150px; animation: pulse 2.4s ease-out infinite; }
      @keyframes pulse { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect x="64" y="70" width="56" height="5" rx="2.5" fill="url(#acc)"/>

  <text x="64" y="132" class="sans" font-size="46" font-weight="700" fill="#ecfeff">Anesh Somanath Majalikar</text>
  <text x="64" y="174" class="sans" font-size="22" font-weight="600" fill="#5eead4">Software Engineer · Full Stack (PERN)</text>
  <text x="64" y="212" class="sans" font-size="18" fill="#9fb6b3">Version control, deployment and migration</text>
  <text x="64" y="238" class="sans" font-size="18" fill="#9fb6b3">for Qlik Sense and Power BI teams.</text>

  <!-- git graph motif -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M760 150 H1150" stroke="#2b4a46"/>
    <path d="M830 150 C 860 150, 860 92, 890 92 H970 C 1000 92, 1000 150, 1050 150" stroke="#2dd4bf"/>
    <path d="M930 150 C 955 150, 955 208, 980 208 H1020 C 1045 208, 1045 150, 1100 150" stroke="#10b981"/>
  </g>
  <g stroke-width="3">
    <circle cx="790" cy="150" r="7" fill="#0b1a1a" stroke="#2b4a46"/>
    <circle cx="830" cy="150" r="7" fill="#0b1a1a" stroke="#2b4a46"/>
    <circle cx="905" cy="92" r="7" fill="#0b1a1a" stroke="#2dd4bf"/>
    <circle cx="955" cy="92" r="7" fill="#0b1a1a" stroke="#2dd4bf"/>
    <circle cx="930" cy="150" r="7" fill="#0b1a1a" stroke="#2b4a46"/>
    <circle cx="1000" cy="208" r="7" fill="#0b1a1a" stroke="#10b981"/>
    <circle class="pulse" cx="1050" cy="150" r="9" fill="#2dd4bf"/>
    <circle cx="1050" cy="150" r="9" fill="url(#acc)" stroke="#0b1a1a"/>
    <circle cx="1100" cy="150" r="7" fill="#0b1a1a" stroke="#10b981"/>
  </g>
  <text x="905" y="70" class="mono" font-size="13" fill="#6b8f8a">feature</text>
  <text x="980" y="236" class="mono" font-size="13" fill="#6b8f8a">fix</text>
  <text x="1064" y="132" class="mono" font-size="13" fill="#6b8f8a">approved</text>
  <text x="762" y="180" class="mono" font-size="13" fill="#6b8f8a">main</text>
</svg>
