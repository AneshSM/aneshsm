name: Update experience badge

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the first day of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate badges with full years since February 2023
        run: node .github/scripts/badges.js

      - name: Commit when the number changes
        run: |
          if git diff --quiet; then
            echo "Badge already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(readme): update experience badge"
          git push
